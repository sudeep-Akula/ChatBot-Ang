<table border="1" cellpadding="8" cellspacing="0">
  <thead>
    <tr>
      <th>Username</th>
      <th>Mobile</th>
      <th>Email</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of users">
      <td>{{ user.username }}</td>
      <td>{{ user.mobile }}</td>
      <td>{{ user.email }}</td>
    </tr>
  </tbody>
</table>
